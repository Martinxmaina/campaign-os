services:
  - type: web
    name: brightbean-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    preDeployCommand: "python manage.py migrate"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY_SALT
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brightbean-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: STORAGE_BACKEND
        value: s3
      - key: REDIS_URL
        fromService:
          name: brightbean-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: brightbean-redis
    plan: free
    ipAllowList: []

  - type: worker
    name: brightbean-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A config worker -l info --concurrency 2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          name: brightbean-web
          type: web
          envVarKey: SECRET_KEY
      - key: ENCRYPTION_KEY_SALT
        fromService:
          name: brightbean-web
          type: web
          envVarKey: ENCRYPTION_KEY_SALT
      - key: DATABASE_URL
        fromDatabase:
          name: brightbean-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: REDIS_URL
        fromService:
          name: brightbean-redis
          type: keyvalue
          property: connectionString

  - type: worker
    name: brightbean-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A config beat -l info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          name: brightbean-web
          type: web
          envVarKey: SECRET_KEY
      - key: ENCRYPTION_KEY_SALT
        fromService:
          name: brightbean-web
          type: web
          envVarKey: ENCRYPTION_KEY_SALT
      - key: DATABASE_URL
        fromDatabase:
          name: brightbean-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: REDIS_URL
        fromService:
          name: brightbean-redis
          type: keyvalue
          property: connectionString

databases:
  - name: brightbean-db
    plan: free
