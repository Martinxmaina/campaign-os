<div style="font-family:Georgia,serif;color:#1c1917;max-width:640px;margin:0 auto">
  <p style="color:#dc2626;font-size:15px;font-weight:600;margin:0 0 4px">
    Post declined.
  </p>
  <p style="color:#78716c;font-size:13px;margin:0 0 16px">
    A reviewer has declined the following post and left a reason.
  </p>

  <div style="border:1px solid #fca5a5;border-radius:6px;padding:16px;margin:0 0 20px;background:#fff1f2">
    <h2 style="font-size:17px;margin:0 0 8px;color:#1c1917">{{ post.title|default:"(untitled)" }}</h2>
    <p style="font-size:14px;color:#44403c;white-space:pre-wrap;margin:0">{{ post.caption }}</p>
  </div>

  <div style="border-left:3px solid #dc2626;padding:8px 12px;margin:0 0 20px;background:#fef2f2">
    <p style="font-size:13px;color:#78716c;margin:0 0 2px;font-style:italic">Reason given by the reviewer:</p>
    <p style="font-size:14px;color:#1c1917;margin:0;white-space:pre-wrap">{{ reason }}</p>
  </div>

  <p style="color:#78716c;font-size:13px;margin:0">
    You can edit the post and request review again from the platform.
  </p>
</div>
