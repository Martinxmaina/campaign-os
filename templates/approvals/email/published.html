<div style="font-family:Georgia,serif;color:#1c1917;max-width:640px;margin:0 auto">
  <p style="color:#1c1917;font-size:15px;margin:0 0 4px;font-weight:600">
    Approved &amp; published.
  </p>
  <p style="color:#78716c;font-size:13px;margin:0 0 16px">
    Your reviewer approved this post and published it. It passed the content gate on the way out.
  </p>

  {% if cards %}
  <div style="margin:0 0 20px">
    {{ cards|safe }}
  </div>
  {% else %}
  <div style="border:1px solid #e7e5e4;border-radius:6px;padding:16px;margin:0 0 20px">
    <h2 style="font-size:17px;margin:0 0 8px;color:#1c1917">{{ post.title|default:"(untitled)" }}</h2>
    <p style="font-size:14px;color:#44403c;white-space:pre-wrap;margin:0">{{ post.caption }}</p>
  </div>
  {% endif %}

  <p style="color:#78716c;font-size:12px;margin:0">
    No action needed — this is a confirmation.
  </p>
</div>
