<div id="intake-table" hx-get="{% url 'console:intake-board' %}?partial=1&sort={{ sort }}&status={{ status_filter }}&pillar={{ pillar_filter }}"
     hx-trigger="every 45s" hx-swap="outerHTML" hx-target="#intake-table"
     class="overflow-x-auto border border-stone-200 rounded-lg">
  <table class="min-w-max w-full text-sm whitespace-nowrap">
    <thead class="text-left text-stone-500 border-b border-stone-200 bg-stone-50">
      <tr>
        <th class="px-2 py-2 sticky left-0 bg-stone-50"></th>
        <th class="px-2 py-2">ID</th>
        <th class="px-2 py-2">Submitted by</th>
        <th class="px-2 py-2"><a href="?sort=pillar&status={{ status_filter|urlencode }}&pillar={{ pillar_filter|urlencode }}">Pillar</a></th>
        <th class="px-2 py-2">Angle</th>
        <th class="px-2 py-2">Proof point</th>
        <th class="px-2 py-2">Audience</th>
        <th class="px-2 py-2">Sensitivity</th>
        <th class="px-2 py-2">Channel</th>
        <th class="px-2 py-2">Campaign</th>
        <th class="px-2 py-2">Priority</th>
        <th class="px-2 py-2"><a href="?sort=status&status={{ status_filter|urlencode }}&pillar={{ pillar_filter|urlencode }}">Status</a></th>
        <th class="px-2 py-2"><a href="?sort=owner&status={{ status_filter|urlencode }}&pillar={{ pillar_filter|urlencode }}">Owner</a></th>
        <th class="px-2 py-2">Target date</th>
        <th class="px-2 py-2">Notes</th>
        <th class="px-2 py-2">Docs</th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}{% include "content_intake/_row.html" with item=item %}{% empty %}
      <tr><td colspan="16" class="px-2 py-6 text-center text-stone-400">No intake items.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
