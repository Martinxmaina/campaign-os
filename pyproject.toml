[project]
name = "waiis-dispatch-platform"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # Core
    "Django>=5.1,<5.2",
    "django-environ>=0.11,<1.0",
    "psycopg[binary]>=3.1,<4.0",
    "gunicorn>=22.0,<23.0",
    # Auth
    "django-allauth[socialaccount]>=65.0,<66.0",
    "bcrypt>=4.2,<5.0",
    # Celery task queue
    "celery>=5.4,<6",
    "redis>=5,<6",
    # Frontend
    "django-tailwind[reload]>=3.8,<4.0",
    "django-htmx>=1.19,<2.0",
    # Storage
    "django-storages[s3]>=1.14,<2.0",
    "Pillow>=10.4,<11.0",
    # Security
    "django-csp>=3.8,<4.0",
    "django-ratelimit>=4.1,<5.0",
    "cryptography>=43.0,<44.0",
    # Static files
    "whitenoise>=6.7,<7.0",
    # HTTP client
    "httpx>=0.27,<1.0",
    # Office files — .xlsx parsing for the CRM import wizard (lazy import)
    "openpyxl>=3.1,<4.0",
    # Date utilities
    "python-dateutil>=2.9,<3.0",
    # Agent API
    "django-ninja>=1.3,<2.0",
    "mcp>=1.0,<2.0",
    # Dev/Test
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<1.20",
    "django-stubs>=5.0,<6.0",
    "types-python-dateutil>=2.9,<3.0",
    "pytest>=8.3,<9.0",
    "pytest-django>=4.8,<5.0",
    "pytest-cov>=5.0,<6.0",
    "factory-boy>=3.3,<4.0",
    # Monitoring
    "sentry-sdk[django]>=2.13,<3.0",
    "google-api-python-client>=2.197.0",
    "google-auth>=2.53.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "E501",  # line too long (handled by ruff format)
]

[tool.ruff.lint.per-file-ignores]
# Intelligence client exceptions deliberately mirror Stripe / HTTP
# status names ("BadRequest", "NotFound", "Conflict", "RateLimited",
# "ServiceUnavailable", etc.) so the call sites read naturally:
#     except RateLimited as exc: ...
# An "Error" suffix would just be noise on names that already encode
# the failure mode. The flow-control sentinel ``_DeferredToWorker`` in
# views.py is also intentionally suffixless — it's not an error, it's
# a "this branch deferred to the worker" signal.
"apps/intelligence/services/exceptions.py" = ["N818"]
"apps/intelligence/views.py" = ["N818"]
# Ninja's ``File(...)`` / ``Form(...)`` / ``Query(...)`` are intentionally
# called in argument defaults — that's how Ninja registers field
# metadata for OpenAPI generation and request parsing. The B008 check
# doesn't apply.
"apps/api/routers/media.py" = ["B008"]
"apps/api/routers/analytics.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
